---
- name: Ensure user systemd container directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Create Redis Quadlet file
  ansible.builtin.template:
    dest: "{{ ansible_user_dir }}/.config/containers/systemd/redis.container"
    src: redis.container.j2 
  notify: Reload and start Redis
