---
- name: Ensure user systemd container directory exists
  ansible.builtin.file:
    path: /home/rocky/.config/containers/systemd
    state: directory
    mode: '0755'

# ----- Let's Encrypt Certificates Directories -----
- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: /home/rocky/.config/systemd/user
    state: directory
    mode: '0755'

- name: Create Let's Encrypt and Webroot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /home/rocky/.config/letsencrypt
    - /home/rocky/.config/letsencrypt/logs
    - /home/rocky/.config/letsencrypt/work
    - /home/rocky/.config/certbot-www

- name: Check if Let's Encrypt certificate exists
  ansible.builtin.stat:
    path: "/home/rocky/.config/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_chain

- name: Ensure target directory for dummy certificate exists
  ansible.builtin.file:
    path: "/home/rocky/.config/letsencrypt/live/{{ domain_name }}"
    state: directory
    mode: '0755'
  when: not cert_chain.stat.exists

- name: Generate dummy certificate for Nginx initial start
  ansible.builtin.command: >
    openssl req -x509 -nodes -newkey rsa:2048 -days 1
    -keyout /home/rocky/.config/letsencrypt/live/{{ domain_name }}/privkey.pem
    -out /home/rocky/.config/letsencrypt/live/{{ domain_name }}/fullchain.pem
    -subj "/CN={{ domain_name }}"
  args:
    creates: "/home/rocky/.config/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  when: not cert_chain.stat.exists

# ----- Nginx Configuration -----
- name: Create Nginx config directory
  ansible.builtin.file:
    path: /home/rocky/.config/nginx
    state: directory
    mode: '0755'

- name: Template Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /home/rocky/.config/nginx/nginx.conf
    mode: '0644'
  notify: Reload and start Nginx

# ----- Nginx Container Quadlet -----
- name: Template Nginx Quadlet file
  ansible.builtin.template:
    src: nginx.container.j2
    dest: /home/rocky/.config/containers/systemd/nginx.container
    mode: '0644'
  notify: Reload and start Nginx

- name: Flush handlers to start Nginx with dummy certificate
  ansible.builtin.meta: flush_handlers

- name: Remove dummy certificate directory to allow Certbot provisioning
  ansible.builtin.file:
    path: "/home/rocky/.config/letsencrypt/live/{{ domain_name }}"
    state: absent
  when: not cert_chain.stat.exists

# ----- Run Certbot ACME Challenge -----
- name: Run Certbot to provision real certificate
  ansible.builtin.command: >
    podman run -i --rm --name certbot
    --userns=keep-id
    -v /home/rocky/.config/letsencrypt:/etc/letsencrypt:z
    -v /home/rocky/.config/letsencrypt/logs:/var/log/letsencrypt:z
    -v /home/rocky/.config/letsencrypt/work:/var/lib/letsencrypt:z
    -v /home/rocky/.config/certbot-www:/var/www/certbot:z
    docker.io/certbot/certbot certonly
    --webroot -w /var/www/certbot
    -d {{ domain_name }}
    --email {{ letsencrypt_email }}
    --agree-tos --non-interactive
    --force-renewal
  when: not cert_chain.stat.exists
  notify: Reload and start Nginx

# ----- Automatic Renewal Timer -----
- name: Create Certbot renewal service
  ansible.builtin.copy:
    dest: /home/rocky/.config/systemd/user/certbot-renew.service
    content: |
      [Unit]
      Description=Certbot Renewal

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/podman run -i --rm --name certbot --userns=keep-id -v /home/rocky/.config/letsencrypt:/etc/letsencrypt:z -v /home/rocky/.config/letsencrypt/logs:/var/log/letsencrypt:z -v /home/rocky/.config/letsencrypt/work:/var/lib/letsencrypt:z -v /home/rocky/.config/certbot-www:/var/www/certbot:z docker.io/certbot/certbot renew
      ExecStartPost=/usr/bin/systemctl --user reload nginx.service
  notify: Enable Certbot timer

- name: Create Certbot renewal timer
  ansible.builtin.copy:
    dest: /home/rocky/.config/systemd/user/certbot-renew.timer
    content: |
      [Unit]
      Description=Twice daily Certbot renewal check

      [Timer]
      OnCalendar=*-*-* 00/12:00:00
      RandomizedDelaySec=43200
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Enable Certbot timer
