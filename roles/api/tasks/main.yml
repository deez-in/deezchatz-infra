---
- name: Ensure user systemd container directory exists
  ansible.builtin.file:
    path: /home/rocky/.config/containers/systemd
    state: directory
    mode: '0755'

- name: Ensure AWS configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /home/rocky/.aws
    - /home/rocky/.aws/certs

- name: Deploy AWS Roles Anywhere credentials
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: '0600'
  loop:
    - { content: "{{ aws_rolesanywhere_cert }}", dest: "/home/rocky/.aws/certs/cert.pem" }
    - { content: "{{ aws_rolesanywhere_key }}", dest: "/home/rocky/.aws/certs/cert.key" }
  no_log: true
  notify: Reload and start DeezChatz API

- name: Template AWS configuration file
  ansible.builtin.template:
    src: aws_config.j2
    dest: /home/rocky/.aws/config
    mode: '0600'
  notify: Reload and start DeezChatz API

- name: Template DeezChatz API Quadlet file
  ansible.builtin.template:
    src: deezchatz-api.container.j2
    dest: /home/rocky/.config/containers/systemd/deezchatz-api.container
    mode: '0644'
  notify: Reload and start DeezChatz API
