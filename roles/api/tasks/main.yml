---
- name: Ensure user systemd container directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd"
    state: directory
    mode: '0755'

- name: Ensure AWS configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ ansible_facts['user_dir'] }}/.aws"
    - "{{ ansible_facts['user_dir'] }}/.aws/certs"

- name: Deploy AWS Roles Anywhere credentials
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: '0600'
  loop:
    - { content: "{{ aws_rolesanywhere_cert }}", dest: "{{ ansible_facts['user_dir'] }}/.aws/certs/cert.pem" }
    - { content: "{{ aws_rolesanywhere_key }}", dest: "{{ ansible_facts['user_dir'] }}/.aws/certs/cert.key" }
  no_log: true
  notify: Reload and start DeezChatz API

- name: Template AWS configuration file
  ansible.builtin.template:
    src: aws_config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.aws/config"
    mode: '0600'
  notify: Reload and start DeezChatz API

- name: Ensure DeezChatz config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/deezchatz"
    state: directory
    mode: '0700'

- name: Deploy FCM service account key
  ansible.builtin.copy:
    content: "{{ fcm_service_account_key }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/deezchatz/fcm-service-account.json"
    mode: '0600'
  no_log: true
  notify: Reload and start DeezChatz API

- name: Template DeezChatz API Quadlet file
  ansible.builtin.template:
    src: deezchatz-api.container.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd/deezchatz-api.container"
    mode: '0644'
  notify: Reload and start DeezChatz API
