# inventory.yml (If using two different keys)
all:
  vars:
    ansible_user: rocky
    ansible_python_interpreter: /usr/bin/python3

  children:
    public_instances:
      hosts:
        api_broker_node:
          ansible_host: "{{ oci_bastion_ip }}"
          # Define the specific key for the public instance here
          
    private_instances:
      hosts:
        redis_sync_node:
          ansible_host: "{{ oci_private_ip }}" 
          # Define the specific key for the private instance here
      vars:
        ansible_ssh_common_args: '-o ProxyJump={{ ansible_user }}@{{ oci_bastion_ip }}'
