# inventory.yml
all:
  vars:
    ansible_user: rocky
    ansible_python_interpreter: /usr/bin/python3

  children:
    public_instances:
      hosts:
        api_broker_node:
          # Use the SSH alias from ~/.ssh/config
          ansible_host: broker
          
    private_instances:
      hosts:
        redis_sync_node:
          # Use the SSH alias from ~/.ssh/config
          ansible_host: backhaul
